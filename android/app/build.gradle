plugins { id 'com.android.application' }

def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.kaniyan.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kaniyan.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile']); storePassword ks['storePassword']
                keyAlias ks['keyAlias']; keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled true; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    androidResources { noCompress 'wasm', 'data' }
}
// Encrypt + minify the web files and generate the key class before anything compiles.
tasks.register('protectWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'tools/protect.mjs'
}
preBuild.dependsOn 'protectWeb'

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
